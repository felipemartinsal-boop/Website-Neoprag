<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Site temporariamente indisponível</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --color-forest: #1b4332;
            --color-accent: #2d6a4f;
            --color-light: #f1f7f4;
            --color-text: #2b2b2b;
            --color-muted: #6b7b73;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: radial-gradient(circle at 50% 0%, #ffffff 0%, var(--color-light) 100%);
            color: var(--color-text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            line-height: 1.6;
        }

        .card {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border: 1px solid rgba(27, 67, 50, 0.08);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(27, 67, 50, 0.10);
            padding: 48px 40px;
            text-align: center;
        }

        .logo {
            width: 150px;
            max-width: 60%;
            height: auto;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-accent);
            background: rgba(45, 106, 79, 0.10);
            padding: 6px 14px;
            border-radius: 999px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--color-forest);
            margin-bottom: 14px;
        }

        p {
            font-size: 1.02rem;
            color: var(--color-muted);
            margin-bottom: 12px;
        }

        p strong {
            color: var(--color-text);
        }

        .divider {
            width: 48px;
            height: 3px;
            background: var(--color-accent);
            border-radius: 999px;
            margin: 26px auto;
            opacity: 0.5;
        }

        .footer {
            font-size: 0.82rem;
            color: var(--color-muted);
            margin-top: 8px;
        }

        @media (max-width: 480px) {
            .card { padding: 36px 24px; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <main class="card">
        <img src="./src/img/logo-neoprag.png" alt="Logo" class="logo"
             onerror="this.style.display='none'">

        <span class="badge">Site temporariamente fora do ar</span>

        <h1>Estamos temporariamente indisponíveis</h1>

        <p>
            Nosso site está passando por uma <strong>manutenção temporária</strong>
            e voltará ao ar em breve.
        </p>
        <p>
            Agradecemos a compreensão.
        </p>

        <div class="divider"></div>

        <p class="footer">
            Em caso de dúvidas, entre em contato com o responsável pelo site.
        </p>
    </main>
</body>
</html>
